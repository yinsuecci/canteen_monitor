[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "canteen-monitor"
version = "0.1.0"
description = "Windows Wi-Fi broadcast load collection infrastructure"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = ["SQLAlchemy>=2.0.36,<3", "pydantic>=2.10,<3", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1"]

[project.scripts]
canteen-monitor = "canteen_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
